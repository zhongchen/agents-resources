name: Tag review

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tag-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tag report
        run: python scripts/tag_report.py > report.md

      - name: Close existing tag review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --search "Tag review in:title" \
            --json number,title \
            -q '.[] | select(.title | startswith("Tag review ")) | .number' | while read -r n; do
            gh issue close "$n"
          done

      - name: Open tag review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Tag review $(date +%Y-%m)" --body-file report.md
