name: Auto-merge knowledge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'entries/**'
      - 'INDEX.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: startsWith(github.event.pull_request.head.ref, 'knowledge/')
    runs-on: ubuntu-latest
    steps:
      - name: Require this PR only touches entries/ and INDEX.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh pr view "$PR_URL" --json files -q '.files[].path')
          echo "$files"
          if echo "$files" | grep -vqE '^entries/|^INDEX\.md$'; then
            echo "PR touches files outside entries/ and INDEX.md, refusing to auto-merge."
            exit 1
          fi

      # Merge as the App: GITHUB_TOKEN merges skip branch auto-delete and
      # post-merge workflows.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
